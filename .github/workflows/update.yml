Commits go to logs/update.txt (overwritten with today’s date).


Commits are made with your GitHub username & noreply email, so they show up as authored by you (and count toward contributions).


Workflow uses the built-in GITHUB_TOKEN with write permissions.


.github/workflows/update.yml
code
name: Manual update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 👈 ensures GITHUB_TOKEN can push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set date
        run: echo "TODAY=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Write today's date to update.txt
        run: |
          mkdir -p logs
          echo "${{ env.TODAY }}" > logs/update.txt

      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          add: 'logs/update.txt'
          message: "chore: manual update ${{ env.TODAY }}"
          author_name: "Hemant"
          # 👇 Use your GitHub-provided noreply email (replace USERNAME + ID)
          # Format: username@users.noreply.github.com
          author_email: "139684113+Eth56@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

